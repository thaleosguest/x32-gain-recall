name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # necessaire pour attacher l'exe a la release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier que le tag correspond a APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $m = Select-String -Path x32_gain_recall.py -Pattern 'APP_VERSION = "(.+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != APP_VERSION v$v" }

      - name: Installer PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: "Compiler (un seul exe : appli principale + fenetre flottante integree via --float)"
        run: python -m PyInstaller --onefile --hidden-import tkinter --icon assets/icon.ico --name XM32_Gain_Recall_LV1 x32_gain_recall.py

      - name: Test de fumee (l'exe demarre, mode normal et mode --float)
        shell: pwsh
        run: |
          ./dist/XM32_Gain_Recall_LV1.exe --version
          ./dist/XM32_Gain_Recall_LV1.exe --float --version
          # --help construit tout le parseur d'options : attrape une aide mal formee (ex. un % non echappe)
          ./dist/XM32_Gain_Recall_LV1.exe --help
          ./dist/XM32_Gain_Recall_LV1.exe --float --help

      - name: Sommes de controle SHA-256
        shell: pwsh
        run: (Get-FileHash dist/XM32_Gain_Recall_LV1.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/XM32_Gain_Recall_LV1.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: XM32_Gain_Recall_LV1-windows
          path: dist/XM32_Gain_Recall_LV1.exe*

      - name: Publier la release (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XM32_Gain_Recall_LV1.exe
            dist/XM32_Gain_Recall_LV1.exe.sha256
