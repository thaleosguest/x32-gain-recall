name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # necessaire pour attacher l'exe a la release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier que le tag correspond a APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $m = Select-String -Path x32_gain_recall.py -Pattern 'APP_VERSION = "(.+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != APP_VERSION v$v" }

      - name: Installer PyInstaller et PySide6 (float Qt, 3.0.0)
        run: python -m pip install --upgrade pip pyinstaller PySide6-Essentials

      - name: "Compiler (un seul exe : appli principale + fenetre flottante integree via --float)"
        # --noconsole (2.3.0) : plus de fenetre noire, l'appli vit dans une icone pres de l'horloge (tray.py)
        # 3.0.0 : float Qt (x32_qt_float + x32_qt_panels, importes a la demande) ; tkinter garde pour le float tk
        # de secours (--tk-float)
        run: >-
          python -m PyInstaller --onefile --noconsole --uac-admin --hidden-import tkinter
          --hidden-import x32_qt_float --hidden-import x32_qt_panels
          --hidden-import x32_qt_stage --hidden-import lv1.remote --hidden-import lv1.colorclick
          --hidden-import PySide6.QtWidgets --hidden-import PySide6.QtSvg
          --icon assets/icon.ico --name XM32_Gain_Recall_LV1 x32_gain_recall.py

      - name: Test de fumee (l'exe demarre, mode normal et mode --float)
        shell: pwsh
        # exe sans console : PowerShell n'attend pas une appli fenetree -> Start-Process -Wait et code de sortie.
        # --help construit tout le parseur d'options : attrape une aide mal formee (ex. un % non echappe)
        run: |
          foreach ($opts in @("--version", "--float --version", "--help", "--float --help", "--float --tk --version")) {
            $p = Start-Process ./dist/XM32_Gain_Recall_LV1.exe -ArgumentList $opts -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "XM32_Gain_Recall_LV1.exe $opts : code de sortie $($p.ExitCode)" }
            "OK : $opts"
          }

      - name: Sommes de controle SHA-256
        shell: pwsh
        run: (Get-FileHash dist/XM32_Gain_Recall_LV1.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/XM32_Gain_Recall_LV1.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: XM32_Gain_Recall_LV1-windows
          path: dist/XM32_Gain_Recall_LV1.exe*

      - name: Publier la release (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XM32_Gain_Recall_LV1.exe
            dist/XM32_Gain_Recall_LV1.exe.sha256
